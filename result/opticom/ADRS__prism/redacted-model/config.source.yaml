runner:
  max_iterations: 30
  stagnation_threshold: 3
  baseline: opticom
  warm_start_from_result: true
  seed_initial_evaluation: true

benchmark:
  enabled: true
  root: ../benchmarks
  task_id: third_autocorr_ineq

llm:
  provider: redacted
  model: redacted-model
  api_key: null
  base_url: null
  temperature: 0.4
  max_tokens: 8192
  top_p: 0.95
  timeout: 180
  max_retries: 2

harness:
  benchmark_timeout: 600
  python_executable: null

archive:
  top_k: 3
  objective_metric: combined_score
  maximize: true

context:
  max_context_length: 12000
  artifact_max_chars: 7000
  evidence_max_chars: 2500

memory:
  summarize_every_n_events: 3

evaluation:
  enable_robustness_gate: false
  cost_soft_limit_ms: 600000
